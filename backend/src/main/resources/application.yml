server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: sbertrack-platform
  jackson:
    serialization:
      write-dates-as-timestamps: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info

sbertrack:
  openapi:
    title: "СберТрек Платформа API"
    version: "0.1.0"
