# Production profile — activate with SPRING_PROFILES_ACTIVE=prod.
# Every secret below has NO default: if the corresponding env var is
# missing, Spring Boot fails fast at startup instead of silently falling
# back to a dev-only placeholder. See ../../.env.example for what to set.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

sbertrack:
  auth:
    jwt-secret: ${JWT_SECRET}
